<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鱼竿曲线识别与力学预测</title>
<style>
:root {
  color-scheme: light;
  --ink: #142b28; --muted: #46635f; --teal: #0d6f61;
  --paper: #fff; --wash: #eef4f1; --border: #d2e0db;
  font: 15px/1.55 "Segoe UI", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); color: var(--ink); background: var(--wash); }
h1, h2, p { margin: 0; }
button, input { font: inherit; }
button { cursor: pointer; padding: 6px 11px; border: 1px solid var(--border); border-radius: 7px; color: var(--ink); background: var(--paper); white-space: nowrap; }
button:hover:not(:disabled), button[aria-pressed="true"] { background: #e3f0eb; color: #0c624e; border-color: #bedacd; }
button:disabled { opacity: .48; cursor: default; }
button.primary { color: #fff; background: var(--teal); border-color: var(--teal); }
button.primary:hover:not(:disabled) { color: #fff; background: #095a50; }
:focus-visible { outline: 2px solid #158976; outline-offset: 3px; }
.topbar { display: flex; align-items: center; gap: 14px 26px; flex-wrap: wrap; padding: 11px 20px; background: var(--paper); border-bottom: 1px solid var(--border); }
.topbar h1 { font-size: 19px; font-weight: 700; }
.switcher, .actions { display: flex; gap: 6px; flex-wrap: wrap; }
.switcher button[aria-pressed="true"] { font-weight: 650; }
.workspace { min-height: 0; }
.recognition { display: grid; grid-template: minmax(0, 1fr) auto / 255px minmax(0, 1fr); gap: 9px 13px; height: 100%; padding: 13px 16px 8px; }
.card { min-width: 0; min-height: 0; border: 1px solid var(--border); border-radius: 12px; background: var(--paper); overflow: hidden; }
.sidebar { padding: 14px; overflow: auto; }
.sidebar section + section { margin-top: 15px; }
.sidebar h2, .sidebar label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: 650; }
.wide { width: 100%; }
.actions button { flex: auto; }
small, .small { font-size: 12px; color: var(--muted); }
.sidebar p { margin-top: 4px; overflow-wrap: anywhere; }
.sidebar input[type="number"] { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; color: var(--ink); }
#extract { margin-top: 8px; }
.measurement { padding: 9px 11px; background: #eaf5ef; border-radius: 8px; }
.measurement output { display: block; color: var(--teal); font-weight: 700; font-size: 23px; font-variant-numeric: tabular-nums; }
.stage { display: grid; grid-template-rows: auto minmax(0, 1fr); }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px 10px; border-bottom: 1px solid var(--border); }
.drawing { position: relative; min-height: 0; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.placeholder { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 5px; padding: 12px; text-align: center; pointer-events: none; }
.placeholder strong { font-size: 20px; }
#status { grid-column: 1 / -1; min-height: 20px; }
#status.error { color: #8c321b; }
#model { display: block; width: 100%; height: 100%; border: 0; }
@media (max-width: 760px) {
  .recognition { grid-template-columns: 210px minmax(0, 1fr); padding-inline: 8px; gap: 6px; }
  .sidebar { padding: 9px; }
  .toolbar button { font-size: 13px; }
}
</style>
<script src="app.js" defer></script>
</head>
<body>
<header class="topbar">
  <h1>鱼竿曲线识别与力学预测</h1>
  <nav class="switcher" aria-label="工作页面">
    <button id="recognition-page" type="button" aria-pressed="true" aria-controls="recognition">图像识别</button>
    <button id="model-page" type="button" aria-pressed="false" aria-controls="model">力学预测</button>
  </nav>
</header>
<main class="workspace">
  <div id="recognition" class="recognition">
    <aside class="sidebar card" aria-label="照片与识别设置">
      <section>
        <h2>实验照片</h2>
        <input id="photo-file" type="file" accept="image/*,.tif,.tiff" hidden>
        <button id="open-photo" class="wide" type="button">导入图片…</button>
        <p id="photo-name" class="small">尚未导入照片</p>
      </section>
      <section>
        <h2>参照点</h2>
        <p class="small">夹具出口 → 可选引导点 → 实际竿梢</p>
        <p id="point-count" class="small">至少选择夹具出口和竿梢两点。</p>
        <div class="actions">
          <button id="undo" type="button" disabled>撤销上一个</button>
          <button id="clear" type="button" disabled>清空</button>
        </div>
      </section>
      <section>
        <h2>夹持角</h2>
        <div class="actions">
          <button id="pick-angle" type="button" disabled aria-pressed="false">测量夹持角</button>
          <button id="clear-angle" type="button" disabled>移除</button>
        </div>
        <p id="angle-note" class="small">以照片水平线为基准。</p>
      </section>
      <section>
        <label for="length">自由段弧长（mm）</label>
        <input id="length" type="number" min="0" step="any" aria-describedby="length-note">
        <p id="length-note" class="small">填夹具出口至竿梢沿竿身的实测长度。留空时使用像素。</p>
        <button class="primary wide" id="extract" type="button" disabled>提取曲线</button>
      </section>
      <section class="measurement">
        <h2>竿梢至夹具水平面的垂直距离</h2>
        <output id="tip-distance">—</output>
        <p id="tip-coordinates" class="small">完成曲线提取后显示</p>
      </section>
    </aside>
    <section class="stage card" aria-label="照片与变形曲线">
      <div class="toolbar">
        <div class="actions">
          <button id="photo-view" type="button" aria-pressed="true">照片标注</button>
          <button id="curve-view" type="button" aria-pressed="false" disabled>变形曲线</button>
          <button id="pan" type="button" aria-pressed="false" disabled>拖动平移</button>
          <button id="reset-view" type="button" disabled>重置视图</button>
        </div>
        <div class="actions">
          <button id="export-curve" type="button" disabled>导出实测 CSV</button>
          <button id="send-curve" type="button" class="primary" disabled>送入模型对照</button>
        </div>
      </div>
      <div class="drawing">
        <canvas id="drawing" aria-label="标注照片或查看实测变形曲线"></canvas>
        <div id="placeholder" class="placeholder">
          <strong>尚未导入照片</strong>
          <p class="small">导入侧视照片后，沿竿身标注夹具出口和竿梢。</p>
        </div>
      </div>
    </section>
    <p id="status" class="small" role="status">导入鱼竿侧视照片开始。</p>
  </div>
  <iframe id="model" title="力学预测与实测对照" src="model" hidden></iframe>
</main>
</body>
</html>
